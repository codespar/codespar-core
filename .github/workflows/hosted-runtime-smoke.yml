name: hosted-runtime smoke

on:
  # Only what changes the installed artifact or the smoke itself. A
  # types-only or python-only merge cannot move this job's outcome.
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'scripts/hosted-smoke.mjs'
      - 'scripts/hosted-smoke-sdk-version.mjs'
      - 'scripts/npm-registry.mjs'
      - '.github/workflows/hosted-runtime-smoke.yml'
  # The exact version exists on the registry only once Publish has run.
  workflow_run:
    workflows: [Publish]
    types: [completed]
  pull_request:
    paths:
      - 'packages/core/**'
      - 'packages/types/**'
      - 'packages/python/**'
      # The CLI is the caller that sends `servers: []`. Without it here, a
      # CLI change never triggers the one job that talks to the served API.
      - 'packages/cli/**'
      - 'scripts/hosted-smoke.mjs'
      - 'scripts/hosted-smoke-sdk-version.mjs'
      - 'scripts/npm-registry.mjs'
      - '.github/workflows/hosted-runtime-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Validates the published @codespar/sdk against the wire-compatible
    # runtime hosted at api.codespar.dev. Installs the SDK fresh from npm
    # (not the workspace source), at the version packages/core declares,
    # so the job proves the registry carries what main says is current
    # and that artifact still round-trips against the served API. A
    # pinned older version proved neither — it kept passing while the
    # SDK moved six releases ahead of it.
    #
    # Two modes (scripts/hosted-smoke-sdk-version.mjs). After the Publish
    # workflow completes, and on manual runs, the workspace version must
    # be on the registry or the job fails: that is the one moment the
    # exact version is known to exist. On pull requests and on push to
    # main the newest published release at or below the workspace version
    # is used, with a warning when it is older — the bump merges before
    # `npm publish` runs, so requiring the exact version there would fail
    # every release on a 404 and nothing would re-run once it exists.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install published @codespar/sdk
        env:
          SMOKE_SDK_MODE: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run') && 'exact' || 'at-or-below' }}
        run: |
          version=$(node scripts/hosted-smoke-sdk-version.mjs)
          mkdir _smoke && cd _smoke
          npm init -y >/dev/null
          npm install "@codespar/sdk@${version}"
          echo "smoke runs against @codespar/sdk@${version}"

      - name: Run hosted-runtime smoke
        env:
          CODESPAR_API_KEY: ${{ secrets.CODESPAR_HOSTED_TEST_API_KEY }}
          CODESPAR_BASE_URL: https://api.codespar.dev
          CODESPAR_SDK_DIR: _smoke
        run: node scripts/hosted-smoke.mjs

  # The generated REST client in @codespar/sdk describes the OpenAPI
  # document committed as packages/core/openapi-snapshot.json. The hermetic
  # half (snapshot -> src/generated/, table -> paths type) runs in the
  # package's vitest suite on every PR. This half reaches the served
  # document, which is why it lives here with the other job that talks to
  # api.codespar.dev and not in the required `ci` job: a proxy serving a
  # cached body, or the API having a bad minute, must not read as a broken
  # PR. When it fails on a real change, the fix is a refresh commit
  # (`npm run sdk:spec:refresh`), reviewed on its own. Exit 2 (could not
  # fetch) fails the job too; "could not compare" is not "current".
  #
  # Only on pull requests and manual runs: the served document moves on
  # its own schedule, and the fix is a refresh commit reviewed on its
  # own, so a red run on every post-merge push or publish would report
  # nothing a PR run did not.
  spec-freshness:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Snapshot equals the served OpenAPI document
        run: npm run sdk:spec:check
