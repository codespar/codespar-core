# TEMPORARY (lane documentos): build, typecheck, test and offline spec check of the documents clients branch
# (feat/documents-clients, head 37fba3914): sdk, cli, mcp, types, and the Python package. Never merged.
name: ci-run documents-clients (temporary)
on:
  push:
    branches: [ci-run/documents-clients]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: cd packages/core && node scripts/openapi-spec.mjs check --offline
      - run: npx turbo run build typecheck --filter=@codespar/sdk --filter=@codespar/cli --filter=@codespar/mcp --filter=@codespar/types
      - run: cd packages/core && npx vitest run
      - run: cd packages/cli && npx vitest run
      - run: cd packages/mcp && npx vitest run
      - run: cd packages/types && npx vitest run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cd packages/python && pip install -q -e ".[dev]" && pytest -q
